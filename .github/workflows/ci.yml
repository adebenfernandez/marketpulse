# Integración continua (CI): en cada pull request hacia main, y en cada push a main, comprueba que
# el código pasa el linter, los tests y la validación de Terraform. Si algo falla, el PR sale en rojo.
#
# Este workflow NO usa credenciales de AWS ni despliega nada: los tests no llaman a internet y
# `terraform validate` no necesita la nube. El despliegue lo hace CodeBuild dentro de AWS (D-027).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Mínimo privilegio también aquí: el token automático de GitHub (GITHUB_TOKEN) solo puede LEER el
# repositorio. Ningún paso necesita escribir (ni comentar PR, ni crear releases)
permissions:
  contents: read

# Si llega un push nuevo al mismo PR mientras la CI anterior sigue en marcha, se cancela la vieja:
# solo importa el resultado del último commit
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-24.04 # versión fija del runner, en vez de "latest", que cambia sin avisar
    timeout-minutes: 10
    steps:
      # Las acciones se fijan por el SHA del commit, no por la etiqueta (v7): una etiqueta se puede
      # mover a otro código; un SHA no. El comentario dice a qué versión corresponde
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no dejar el token de GitHub guardado en .git/config

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13" # la misma que el venv local y que las Lambdas
          cache: pip # reutiliza los paquetes descargados entre ejecuciones
          cache-dependency-path: pyproject.toml

      - name: Instalar el proyecto, el agente y las herramientas de desarrollo
        run: pip install -e ".[dev,agent]" # agent: los tests del validador de SQL usan sqlglot

      - name: Linter (ruff check)
        run: ruff check .

      - name: Formato (ruff format --check)
        run: ruff format --check .

      - name: Tests (pytest)
        run: pytest -q

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Las dos configuraciones (infra y bootstrap) usan el mismo proveedor: se descarga una vez
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tf-plugin-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6 # la misma versión que en local
          terraform_wrapper: false # salida de terraform tal cual, sin el envoltorio de la acción

      - name: Formato (terraform fmt -check)
        run: terraform -chdir=infra fmt -check -recursive

      - name: Validar infra/ y infra/bootstrap/
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for dir in infra infra/bootstrap; do
            echo "::group::$dir"
            # -backend=false: no se conecta al state de S3 (no hay credenciales, ni hacen falta).
            # -lockfile=readonly: usa EXACTAMENTE las versiones del .terraform.lock.hcl del repo
            terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
