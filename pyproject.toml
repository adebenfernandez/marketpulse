[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketpulse"
version = "0.1.0"
description = "Plataforma de datos de mercados en AWS con agente text-to-SQL"
readme = "README.md"
# Misma versión que usaremos en el runtime de AWS Lambda
requires-python = ">=3.13,<3.14"
authors = [{ name = "Alberto Debén Fernández" }]
dependencies = [
    "requests>=2.32",       # llamadas HTTP a las APIs (D-008)
    "PyYAML>=6.0",          # leer config/watchlist.yaml
    "python-dotenv>=1.0",   # cargar claves de API desde .env en local
    # Transformación y data lake (D-015). Las tres vienen en la capa "AWS SDK for pandas" de Lambda
    "pandas>=2.2",          # tablas en memoria (DataFrame)
    "pyarrow>=18",          # leer y escribir Parquet, esquemas con tipos
    "boto3>=1.35",          # SDK de AWS para Python (subida a S3, paso 2.6)
]

[project.optional-dependencies]
# Agente text-to-SQL (Fase 7, D-029). Extra aparte: no viajan al zip de Lambda,
# que solo empaqueta [project.dependencies]
agent = [
    "anthropic>=2.1,<3",    # SDK oficial de la API de Claude (versión de API 2026-10-21)
    "sqlglot>=30.23",       # analizar la SQL como árbol (AST) para validar que es un único SELECT
    "fastapi>=0.159",       # API HTTP del agente
    "uvicorn>=0.54",        # servidor que ejecuta la app de FastAPI
]
# Dashboard (Fase 8, D-041): se instala junto a `agent` (pip install -e ".[agent,dashboard]").
# Ni la CI ni la imagen de Docker lo necesitan: los tests prueban dashboard/data.py, sin Streamlit
dashboard = [
    "streamlit==1.66.1",    # interfaz web en Python; fijada (se publican versiones a menudo)
]
# Herramientas solo para desarrollo: no viajan a Lambda
dev = [
    "ruff>=0.14",
    "pytest>=8.4",
    # boto3 necesita awscrt para leer las credenciales de `aws login` (D-019). Solo en local:
    # en Lambda y en GitHub Actions las credenciales vienen de un rol
    "botocore[crt]",
    # Cobertura de tests (Fase 8, D-038). Fijada: la 7.17.0 era del día anterior al elegirla
    "coverage==7.16.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: estilo PEP 8 · F: errores (variables sin usar...) · I: orden de imports
# B: bugs habituales · UP: sintaxis moderna de Python
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# api/ (FastAPI, Fase 7) y dashboard/ (Streamlit, Fase 8) también son código nuestro
known-first-party = ["marketpulse", "api", "dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# Cobertura: `coverage run -m pytest` y después `coverage report` (D-038)
[tool.coverage.run]
source = ["src/marketpulse"]  # el criterio de éxito mide src/; tests, api/ y scripts/ no cuentan
branch = true                 # además de líneas, mide si cada `if` se ha probado por los dos lados

[tool.coverage.report]
show_missing = true           # lista las líneas sin probar de cada fichero
fail_under = 70               # `coverage report` devuelve código 2 por debajo del 70 %
