# Configuración de Streamlit (D-041 y D-044). Se lee al lanzar
# `python -m streamlit run dashboard/app.py` desde la raíz del proyecto.

[client]
toolbarMode = "minimal"  # sin el botón "Deploy": este dashboard no se publica (D-039)

[server]
address = "127.0.0.1"  # solo se llega desde este ordenador (como la API en Docker, D-037)
port = 8501
headless = true        # no abre el navegador solo ni pide un email al arrancar

[browser]
gatherUsageStats = false  # sin estadísticas de uso hacia Streamlit (privacidad)
serverAddress = "127.0.0.1"

# Tema claro y minimalista (D-044): blanco, tinta casi negra, un solo acento azul (el mismo
# que el primer color de los gráficos) y bordes de un gris muy suave
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f6f4"
textColor = "#0b0b0b"
borderColor = "#e6e5e0"
showWidgetBorder = true
baseRadius = "0.6rem"
font = "sans-serif"
headingFontWeights = 600
metricValueFontWeight = 600
